name: Check static website
on:
  push:
    branches: [main, site/colomigo-launch]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check HTML structure and local references
        run: python3 scripts/check_site.py
      - name: Check JavaScript syntax
        run: node --check assets/site.js
